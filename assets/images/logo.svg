<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <!-- Gradient for Rotating Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <!-- Gradient for Text -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- CSS Animations -->
    <style>
      .rotating-ring {
        transform-origin: 50px 50px;
        animation: rotate 4s linear infinite;
      }
      .pulsing-bg {
        transform-origin: 50px 50px;
        animation: pulse 2s ease-in-out infinite alternate;
      }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0% { transform: scale(0.96); opacity: 0.8; }
        100% { transform: scale(1.02); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Dark Background (optional, remove if you want transparent background) -->
  <rect width="100" height="100" rx="20" fill="#0d1117" />

  <!-- Outer Glowing Ring -->
  <circle class="rotating-ring" cx="50" cy="50" r="40" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="60 30" />

  <!-- Inner Circle Core with Pulse Effect -->
  <circle class="pulsing-bg" cx="50" cy="50" r="34" fill="#161b22" stroke="#21262d" stroke-width="1.5" />

  <!-- Logo Text (TN) -->
  <text x="50" y="56" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="url(#textGrad)" text-anchor="middle" letter-spacing="1">TN</text>
</svg>
